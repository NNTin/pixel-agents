# CI workflow for pixel-agents

name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/FUNDING.yml'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/FUNDING.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json
            server/package-lock.json

      - name: Install Root Dependencies
        id: install_root
        run: npm ci

      - name: Install Webview Dependencies
        id: install_webview
        working-directory: webview-ui
        run: npm ci

      - name: Install Server Dependencies
        id: install_server
        working-directory: server
        run: npm ci

      # --- Quality Checks (blocking) ---

      - name: Type Check
        id: type_check
        if: always() && steps.install_root.outcome == 'success' && steps.install_server.outcome == 'success'
        run: npm run check-types
        continue-on-error: true

      - name: Lint
        id: lint
        if: always() && steps.install_root.outcome == 'success' && steps.install_webview.outcome == 'success'
        run: npm run lint
        continue-on-error: true

      - name: Webview Tests
        id: webview_test
        if: always() && steps.install_webview.outcome == 'success'
        working-directory: webview-ui
        run: npm test
        continue-on-error: true

      - name: Upload Linux Webview Allure Results
        if: always() && steps.install_webview.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-webview-linux
          if-no-files-found: warn
          path: allure-results/webview

      - name: Format Check
        id: format_check
        if: always() && steps.install_root.outcome == 'success'
        run: npm run format:check
        continue-on-error: true

      - name: Knip (advisory)
        id: knip
        if: always() && steps.install_root.outcome == 'success'
        run: npm run knip
        continue-on-error: true

      # --- Build (blocking) ---

      - name: Build
        id: build
        if: always() && steps.install_root.outcome == 'success' && steps.install_webview.outcome == 'success'
        run: |
          node esbuild.js
          cd webview-ui && npm run build
        continue-on-error: true

      # --- Server Tests (require build for hook script) ---

      - name: Server Tests
        id: server_test
        if: always() && steps.build.outcome == 'success' && steps.install_server.outcome == 'success'
        working-directory: server
        run: npm test
        continue-on-error: true

      - name: Upload Linux Server Allure Results
        if: always() && steps.build.outcome == 'success' && steps.install_server.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-server-linux
          if-no-files-found: warn
          path: allure-results/server

      # --- Audit Checks (blocking) ---

      - name: Audit Root Dependencies
        id: audit_root
        if: always() && steps.install_root.outcome == 'success'
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Audit Webview Dependencies
        id: audit_webview
        if: always() && steps.install_webview.outcome == 'success'
        working-directory: webview-ui
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Audit Server Dependencies
        id: audit_server
        if: always() && steps.install_server.outcome == 'success'
        working-directory: server
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # --- Summary ---

      - name: Write Step Summary
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL_ROOT: ${{ steps.install_root.outcome }}
          INSTALL_WEBVIEW: ${{ steps.install_webview.outcome }}
          TYPE_CHECK: ${{ steps.type_check.outcome }}
          LINT: ${{ steps.lint.outcome }}
          WEBVIEW_TEST: ${{ steps.webview_test.outcome }}
          FORMAT_CHECK: ${{ steps.format_check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SERVER_TEST: ${{ steps.server_test.outcome }}
          AUDIT_ROOT: ${{ steps.audit_root.outcome }}
          AUDIT_WEBVIEW: ${{ steps.audit_webview.outcome }}
          AUDIT_SERVER: ${{ steps.audit_server.outcome }}
          KNIP: ${{ steps.knip.outcome }}
        run: |
          status() {
            if [ "$1" = "success" ]; then echo "✅ PASS"; else echo "❌ FAIL"; fi
          }
          advisory() {
            if [ "$1" = "success" ]; then echo "✅ PASS"; else echo "⚠️ WARN"; fi
          }
          {
            echo "## CI Results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Checkout | $(status "$CHECKOUT") |"
            echo "| Setup Node | $(status "$SETUP_NODE") |"
            echo "| Install root deps | $(status "$INSTALL_ROOT") |"
            echo "| Install webview deps | $(status "$INSTALL_WEBVIEW") |"
            echo "| **Type check** | $(status "$TYPE_CHECK") |"
            echo "| **Lint** | $(status "$LINT") |"
            echo "| **Webview tests** | $(status "$WEBVIEW_TEST") |"
            echo "| **Format check** | $(status "$FORMAT_CHECK") |"
            echo "| **Build** | $(status "$BUILD") |"
            echo "| **Server tests** | $(status "$SERVER_TEST") |"
            echo "| Audit root _(advisory)_ | $(advisory "$AUDIT_ROOT") |"
            echo "| Audit webview _(advisory)_ | $(advisory "$AUDIT_WEBVIEW") |"
            echo "| Audit server _(advisory)_ | $(advisory "$AUDIT_SERVER") |"
            echo "| Knip _(advisory)_ | $(advisory "$KNIP") |"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Final Gate ---

      - name: Fail If Any Blocking Check Failed
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL_ROOT: ${{ steps.install_root.outcome }}
          INSTALL_WEBVIEW: ${{ steps.install_webview.outcome }}
          TYPE_CHECK: ${{ steps.type_check.outcome }}
          LINT: ${{ steps.lint.outcome }}
          WEBVIEW_TEST: ${{ steps.webview_test.outcome }}
          FORMAT_CHECK: ${{ steps.format_check.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SERVER_TEST: ${{ steps.server_test.outcome }}
        run: |
          failed=0
          for step in CHECKOUT SETUP_NODE INSTALL_ROOT INSTALL_WEBVIEW \
                      TYPE_CHECK LINT \
                      WEBVIEW_TEST FORMAT_CHECK BUILD SERVER_TEST; do
            val=$(printenv "$step" 2>/dev/null || echo "skipped")
            if [ "$val" != "success" ]; then
              echo "::error::$step failed"
              failed=1
            fi
          done
          exit "$failed"

  e2e:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json
            server/package-lock.json

      - name: Restore VS Code Cache
        id: cache_vscode_restore
        uses: actions/cache/restore@v5
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('e2e/global-setup.ts') }}-v2
          restore-keys: |
            vscode-test-${{ runner.os }}-

      - name: Restore Playwright Cache
        id: cache_playwright_restore
        uses: actions/cache/restore@v5
        with:
          path: .playwright-browsers
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Webview Dependencies
        working-directory: webview-ui
        run: npm ci

      - name: Build
        run: node esbuild.js

      - name: Build Webview
        working-directory: webview-ui
        run: npm run build

      - name: Install Playwright Dependencies
        id: install_playwright_deps
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: E2E Tests
        id: e2e_test
        if: steps.install_playwright_deps.outcome == 'success'
        run: npm run e2e
        continue-on-error: true

      - name: Upload E2E Artifacts
        if: always() && steps.install_playwright_deps.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            playwright-report/e2e
            test-results/e2e

      - name: Upload Linux Allure Results
        if: always() && matrix.os == 'ubuntu-latest' && steps.install_playwright_deps.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-linux
          if-no-files-found: warn
          path: allure-results/e2e

      - name: Save VS Code Cache
        if: always() && steps.cache_vscode_restore.outputs.cache-hit != 'true' && steps.e2e_test.outcome == 'success' && hashFiles('.vscode-test/vscode-executable.txt') != ''
        uses: actions/cache/save@v5
        with:
          path: .vscode-test
          key: ${{ steps.cache_vscode_restore.outputs.cache-primary-key }}

      - name: Save Playwright Cache
        if: always() && steps.cache_playwright_restore.outputs.cache-hit != 'true' && steps.install_playwright_deps.outcome == 'success' && hashFiles('.playwright-browsers/**') != ''
        uses: actions/cache/save@v5
        with:
          path: .playwright-browsers
          key: ${{ steps.cache_playwright_restore.outputs.cache-primary-key }}

      - name: Write Step Summary
        if: always()
        shell: bash
        env:
          OS: ${{ matrix.os }}
          INSTALL_PLAYWRIGHT_DEPS: ${{ steps.install_playwright_deps.outcome }}
          E2E_TEST: ${{ steps.e2e_test.outcome }}
        run: |
          status() {
            if [ "$1" = "success" ]; then echo "✅ PASS"; else echo "❌ FAIL"; fi
          }
          {
            echo "## E2E Results ($OS)"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Install Playwright deps | $(status "$INSTALL_PLAYWRIGHT_DEPS") |"
            echo "| E2E tests | $(status "$E2E_TEST") |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-preview-precheck:
    needs: e2e
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.deploy_precheck.outputs.ready }}
      reason: ${{ steps.deploy_precheck.outputs.reason }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check Vercel Configuration
        id: deploy_precheck
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name || '' }}" != "${{ github.repository }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=fork-pr" >> "$GITHUB_OUTPUT"
          elif [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-secrets" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Skip Summary
        if: steps.deploy_precheck.outputs.ready != 'true'
        shell: bash
        env:
          SKIP_REASON: ${{ steps.deploy_precheck.outputs.reason }}
        run: |
          if [ "$SKIP_REASON" = "fork-pr" ]; then
            reason="pull request comes from a fork, so deployment is skipped."
          else
            reason="missing one or more required Vercel secrets."
          fi
          {
            echo "## Hosted Browser Preview"
            echo
            echo "- Skipped: $reason"
            echo "- Required secrets: \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, \`VERCEL_PROJECT_ID\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    needs: deploy-preview-precheck
    if: always() && needs.deploy-preview-precheck.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Webview Dependencies
        working-directory: webview-ui
        run: npm ci

      - name: Download Linux Allure Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-e2e-linux
          path: allure-results/e2e

      - name: Download Linux Server Allure Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-server-linux
          path: allure-results/server

      - name: Download Linux Webview Allure Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-webview-linux
          path: allure-results/webview

      - name: Prepare Vercel Output
        run: npm run vercel:prepare

      - name: Deploy to Vercel
        id: deploy_vercel
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          args=(deploy --prebuilt --token "$VERCEL_TOKEN" --yes)
          deployment_kind=preview

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            args+=(--prod)
            deployment_kind=production
          fi

          deployment_url="$(npx --yes vercel@50.42.0 "${args[@]}")"
          echo "deployment_kind=$deployment_kind" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Write Deployment Summary
        if: always() && steps.deploy_vercel.outcome == 'success'
        shell: bash
        env:
          DEPLOYMENT_KIND: ${{ steps.deploy_vercel.outputs.deployment_kind }}
          DEPLOYMENT_URL: ${{ steps.deploy_vercel.outputs.deployment_url }}
        run: |
          base_url="${DEPLOYMENT_URL%/}"
          {
            echo "## Hosted Browser Preview"
            echo
            echo "- Deployment type: $DEPLOYMENT_KIND"
            echo "- Deployment URL: $base_url"
            echo "- Webview preview: $base_url/webview/"
            echo "- Linux Allure report: $base_url/reports/allure/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy_vercel.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOYMENT_URL: ${{ steps.deploy_vercel.outputs.deployment_url }}
        run: |
          base_url="${DEPLOYMENT_URL%/}"
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "$(cat <<EOF
          🔍 Vercel Preview: $base_url
          - Webview preview: $base_url/webview/
          - Linux Allure report: $base_url/reports/allure/
          EOF
          )"
